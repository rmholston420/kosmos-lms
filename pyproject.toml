[project]
name = "kosmos"
version = "0.1.0"
description = "Kosmos LMS — single-user local-first Life Management System (Stage 1.1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rmholston420" }]

dependencies = [
    "httpx>=0.27",
    "structlog>=24.1",
    "pyrage>=1.1",
    "PyYAML>=6.0",
    "redis>=5.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "prometheus-client>=0.20",
    "qdrant-client>=1.11",
    "neo4j>=5.26",
    # ADR-075 D1: graphiti-core removed with GraphitiTemporalIndex hard-delete.
    "agent-memory-guard==0.3.0",

    "rfc8785>=0.1.4",
    "cryptography>=49",
    "aiosqlite>=0.20",
    # Stage 6.5 · zetesis research search backend (plugins/zetesis/research/
    # search_backend.py imports it at module scope).
    "beautifulsoup4>=4.12",
    # Stage 3.3 · aider repomap pattern-vendor (ADR-038)
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=1.13",
    "networkx>=3.4",
    "scipy>=1.14",  # networkx pagerank_scipy backend
    "grep-ast>=0.9",
    "pygments>=2.18",
    "diskcache>=5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    # Stage 3.12 · Stage-3 exit gate (ADR-046). Security scanner required
    # by the DoD literal "Refactor commit passes ruff + bandit + pytest."
    "bandit>=1.7",
]
# Stage 3.8 · Pier eval harness (ADR-042). Vendored via PyPI as a dev-only
# dep so the fast unit tier does not require it to be installed; the
# env-gated `KOSMOS_STAGE_38_REAL_PIER=1` tier and `make eval-gate` do.
eval = [
    "datacurve-pier==0.3.0",
]
# Stage 3.10 · docling document ingestion (ADR-043). Vendored via PyPI
# as an optional dep so the fast unit tier does not require it to be
# installed; the env-gated `KOSMOS_STAGE_310_REAL_DOCLING=1` tier and
# `make ingest-doc` do.
ingest = [
    "docling==2.116.0",
]
# Stage 3.11 · Tektos UI HTMX dashboard (ADR-045). FastAPI + uvicorn are
# runtime deps for `make ui-serve` and the env-gated
# `KOSMOS_STAGE_311_INTERACTIVE=1` tier. The fast unit tier uses
# FastAPI TestClient (installed via `dev`) and needs `httpx` from
# fastapi's test extras.
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]
# Stage 8.0 · RelationalMemoryPort Postgres adapter (ADR-102). The runtime
# driver is lazily imported (ADR-100 D1) so a base install degrades the 5th
# layer gracefully; installing this extra enables the live Postgres layer,
# and sqlalchemy/alembic are required by the vendored migration package.
postgres = [
    "asyncpg>=0.29",
    "pgvector>=0.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ports", "adapters", "adapters.llm", "adapters.llm.ollama", "adapters.llm.llama_swap", "adapters.search", "adapters.search.searxng", "adapters.event_bus", "adapters.event_bus.valkey", "adapters.secrets", "adapters.secrets.age_file", "adapters.observability", "adapters.observability.otel_stack", "adapters.vector", "adapters.vector.qdrant", "adapters.memory", "adapters.memory.dozerdb", "adapters.data", "adapters.data.filesystem", "adapters.resource", "adapters.resource.sqlite", "adapters.notification", "adapters.notification.kernel", "adapters.frontend_contract", "adapters.frontend_contract.kernel", "adapters.mcp", "adapters.mcp.in_process", "adapters.mcp.stdio", "governance", "governance.constitution", "plugins", "plugins.praxis", "plugins.praxis.constitution", "plugins.praxis.apex", "plugins.praxis.apex.tests", "plugins.praxis.tests", "plugins.phrouros", "plugins.phrouros.detectors", "plugins.phrouros.tests", "plugins.tektos", "plugins.tektos.mcp", "plugins.tektos.openspec", "plugins.tektos.renderer", "plugins.tektos.repomap", "plugins.tektos.eval", "plugins.tektos.eval.corpora", "plugins.tektos.eval.corpora.deepswe", "plugins.tektos.ingest", "plugins.tektos.ui", "plugins.tektos.tests", "adapters.approval_resolver", "adapters.approval_resolver.praxis"]

[tool.setuptools.package-data]
# Stage 3.11 (ADR-045): vendored htmx.min.js served from `/htmx.min.js`.
"plugins.tektos.ui" = ["htmx.min.js"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["ports", "adapters", "kernel", "plugins", "ops"]
# Harbor-format eval task fixtures live under plugins/tektos/eval/tasks/.
# Their `tests/` dirs are the Pier verifier's tests — they must not be
# collected by the Kosmos pytest suite (they expect the sandboxed
# `/workspace/src/hello.py` module that Pier stages inside a trial).
norecursedirs = ["plugins/tektos/eval/tasks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

# Stage 3.12 · Stage-3 exit gate (ADR-046). Bandit config for `scripts/stage3_gate.py`.
# B101 (assert_used) is skipped globally because pytest test collection uses
# `assert` heavily; keeping other CWE-mapped rules on for real source paths.
[tool.bandit]
exclude_dirs = [".venv", "build", "dist", "__pycache__"]
skips = ["B101"]

# ── mypy ─────────────────────────────────────────────────────────────
# Vendored donor code (adapters/*/tektos/vendor/) is scaffold-policy MIT re-license
# of Tektos-Ultima and is exempted from stub enforcement; its dependencies
# (pynvml, psutil) are optional/unavailable in the cloud sandbox CI runner
# but present on the Colossus workstation.
[tool.mypy]
files = ["kernel", "ports", "adapters", "plugins", "ops"]

[[tool.mypy.overrides]]
module = "adapters.*.tektos.vendor.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pynvml", "psutil"]
ignore_missing_imports = true
