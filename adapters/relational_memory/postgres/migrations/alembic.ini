; Alembic config for RelationalMemoryPort Postgres adapter (ADR-102).
;
; Usage from repo root:
;
;   export KOSMOS_POSTGRES_URI=postgres://kosmos:secret@localhost:5432/kosmos
;   alembic -c adapters/relational_memory/postgres/migrations/alembic.ini upgrade head
;
; sqlalchemy.url is read from env at runtime (see env.py); the literal value
; below is only a placeholder.

[alembic]
script_location = %(here)s
sqlalchemy.url = postgresql+asyncpg://placeholder@localhost/placeholder
prepend_sys_path = %(here)s
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
