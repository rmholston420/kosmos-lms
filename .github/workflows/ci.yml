# Kosmos-LMS CI — Stage 1 baseline.
#
# Jobs (ADR-077, spec §25 CI absorption):
#   1. python-lint         · ruff check + format on ports/, kernel/, tests/
#   2. python-typecheck    · mypy on ports/ + kernel/
#   3. python-tests        · pytest tests/ports/ + tests/kernel/
#   4. port-contract-tests · pytest tests/ports/ only (protocol conformance)
#   5. plugin-isolation    · scripts/check_plugin_isolation.py (ADR-007)
#   6. frontend-build      · Next.js build in ui/ (Kosmos shell)
#   7. frontend-lint       · ESLint in ui/
#
# Playwright end-to-end (Tektos-Ultima donor job) will layer in at Stage 2
# once ui/ hosts the /tektos/frontend microfrontend per ADR-089.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check ports/ kernel/ tests/ scripts/
      - name: ruff format --check
        run: ruff format --check ports/ kernel/ tests/ scripts/

  python-typecheck:
    name: Python Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy ports + kernel
        run: mypy ports/ kernel/

  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  port-contract-tests:
    name: Port Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run port protocol conformance tests
        # Isolated job so a port-contract regression is visible independent
        # of unrelated kernel / plugin test noise.
        run: pytest tests/ports/ -v --tb=short

  plugin-isolation:
    name: Plugin Isolation (ADR-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check no cross-plugin imports
        run: python scripts/check_plugin_isolation.py

  frontend-build:
    name: Frontend Build (ui/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install deps
        working-directory: ui
        run: npm ci
      - name: Next.js build
        working-directory: ui
        run: npm run build

  frontend-lint:
    name: Frontend Lint (ui/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install deps
        working-directory: ui
        run: npm ci
      - name: ESLint
        working-directory: ui
        run: npm run lint

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - python-typecheck
      - python-tests
      - port-contract-tests
      - plugin-isolation
      - frontend-build
      - frontend-lint
    if: always()
    steps:
      - name: Report results
        env:
          PYTHON_LINT: ${{ needs.python-lint.result }}
          PYTHON_TYPECHECK: ${{ needs.python-typecheck.result }}
          PYTHON_TESTS: ${{ needs.python-tests.result }}
          PORT_CONTRACT: ${{ needs.port-contract-tests.result }}
          PLUGIN_ISOLATION: ${{ needs.plugin-isolation.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          FRONTEND_LINT: ${{ needs.frontend-lint.result }}
        run: |
          echo "=== Kosmos-LMS CI Results ==="
          echo "python-lint:         ${PYTHON_LINT}"
          echo "python-typecheck:    ${PYTHON_TYPECHECK}"
          echo "python-tests:        ${PYTHON_TESTS}"
          echo "port-contract-tests: ${PORT_CONTRACT}"
          echo "plugin-isolation:    ${PLUGIN_ISOLATION}"
          echo "frontend-build:      ${FRONTEND_BUILD}"
          echo "frontend-lint:       ${FRONTEND_LINT}"
          # Summary is informational only — it must not gate on itself.
