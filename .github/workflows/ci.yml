# Kosmos-LMS CI — Stage 1 baseline.
#
# Jobs (ADR-077, spec §25 CI absorption):
#   1. python-lint         · ruff check + format on ports/, kernel/, tests/
#   2. python-typecheck    · mypy on ports/ + kernel/
#   3. python-tests        · pytest tests/ports/ + tests/kernel/
#   4. port-contract-tests · pytest tests/ports/ only (protocol conformance)
#   5. plugin-isolation    · scripts/check_plugin_isolation.py (ADR-007)
#   6. frontend-build      · Next.js build in ui/ (Kosmos shell)
#   7. frontend-lint       · ESLint in ui/
#   8. frontend-e2e        · Playwright chromium against kernel + built UI
#                          (Stage 2 lands this once /tektos-ultima ships)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check ports/ kernel/ tests/ scripts/
      - name: ruff format --check
        run: ruff format --check ports/ kernel/ tests/ scripts/

  python-typecheck:
    name: Python Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy ports + kernel
        run: mypy ports/ kernel/

  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  port-contract-tests:
    name: Port Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run port protocol conformance tests
        # Isolated job so a port-contract regression is visible independent
        # of unrelated kernel / plugin test noise.
        run: pytest tests/ports/ -v --tb=short

  plugin-isolation:
    name: Plugin Isolation (ADR-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check no cross-plugin imports
        run: python scripts/check_plugin_isolation.py

  frontend-build:
    name: Frontend Build (ui/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install deps
        working-directory: ui
        run: npm ci
      - name: Next.js build
        working-directory: ui
        run: npm run build

  frontend-lint:
    name: Frontend Lint (ui/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install deps
        working-directory: ui
        run: npm ci
      - name: ESLint
        working-directory: ui
        run: npm run lint

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        working-directory: ui
        run: npm ci
      - name: Install Playwright chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Build UI (static export → ui/out)
        working-directory: ui
        run: npx next build
      - name: Boot kernel (uvicorn) in the background
        # Playwright config uses KOSMOS_BASE_URL=http://127.0.0.1:8000 by
        # default; the kernel mounts /api/*, /tektos-ultima/frontend/*
        # (reverse proxy), /api/tektos-ultima/bridge (POST), and the
        # Next.js static export at /. No Tektos-Ultima upstream is run
        # in CI; the proxy MUST return the documented 502 diagnostic
        # (asserted in tests/20-tektos-ultima-shell.spec.ts).
        run: |
          nohup uvicorn kernel.app:app --host 127.0.0.1 --port 8000 \
            > kernel.log 2>&1 &
          echo "KERNEL_PID=$!" >> "$GITHUB_ENV"
          # Wait for /health to answer 200 or fail loud after 30s.
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8000/health > /dev/null; then
              echo "kernel is up"
              break
            fi
            sleep 1
          done
          curl -sSf http://127.0.0.1:8000/health
      - name: Run Playwright (chromium)
        working-directory: ui
        env:
          KOSMOS_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test --project=chromium
      - name: Kernel log tail on failure
        if: failure()
        run: tail -n 200 kernel.log || true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - python-typecheck
      - python-tests
      - port-contract-tests
      - plugin-isolation
      - frontend-build
      - frontend-lint
      - frontend-e2e
    if: always()
    steps:
      - name: Report results
        env:
          PYTHON_LINT: ${{ needs.python-lint.result }}
          PYTHON_TYPECHECK: ${{ needs.python-typecheck.result }}
          PYTHON_TESTS: ${{ needs.python-tests.result }}
          PORT_CONTRACT: ${{ needs.port-contract-tests.result }}
          PLUGIN_ISOLATION: ${{ needs.plugin-isolation.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          FRONTEND_LINT: ${{ needs.frontend-lint.result }}
          FRONTEND_E2E: ${{ needs.frontend-e2e.result }}
        run: |
          echo "=== Kosmos-LMS CI Results ==="
          echo "python-lint:         ${PYTHON_LINT}"
          echo "python-typecheck:    ${PYTHON_TYPECHECK}"
          echo "python-tests:        ${PYTHON_TESTS}"
          echo "port-contract-tests: ${PORT_CONTRACT}"
          echo "plugin-isolation:    ${PLUGIN_ISOLATION}"
          echo "frontend-build:      ${FRONTEND_BUILD}"
          echo "frontend-lint:       ${FRONTEND_LINT}"
          echo "frontend-e2e:        ${FRONTEND_E2E}"
          # Summary is informational only — it must not gate on itself.
